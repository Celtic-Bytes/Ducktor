# Builds the package formats that are not in the Releases workflow yet
# (Linux .tar.xz, macOS DMG, Arch PKGBUILD) without publishing anything, so
# they can be exercised in isolation before being folded into releases.yml.
# It never creates a release: run it by hand (workflow_dispatch) and check
# the uploaded artifacts. The arch_full_build input triggers the slow full
# Arch source build; by default the PKGBUILD is only validated.
name: Package test

on:
  workflow_dispatch:
    inputs:
      arch_full_build:
        description: Run the full Arch source build (slow)
        type: boolean
        default: false

permissions:
  contents: read

# One run per ref at a time, like the Releases workflow.
concurrency:
  group: ducktor-package-test-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: 6.9.3

jobs:
  linux-tarball:
    name: Linux .deb + .tar.xz
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      # Same container and toolchain as the Linux job in releases.yml, so the
      # .deb and the new .tar.xz are built exactly as they will be there.
      - name: Install the toolchain
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build file git curl ca-certificates \
            dpkg-dev \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libpulse-dev \
            qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-multimedia-dev qt6-svg-dev qt6-svg-plugins qt6-tools-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-templates qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript \
          && rm -rf /var/lib/apt/lists/*

      - name: Configure and build
        run: |
          set -euo pipefail
          cmake --preset release
          cmake --build --preset release --parallel

      - name: Build the packages
        run: |
          set -euo pipefail
          cpack --preset release

      - name: Verify both formats
        run: |
          set -euo pipefail
          DEB="$(ls dist/*.deb)"
          TXZ="$(ls dist/*.tar.xz)"
          # Check the .deb name is unchanged by the new CPACK_PACKAGE_FILE_NAME.
          echo "deb: $DEB"
          echo "tar.xz: $TXZ"

      - name: Upload the packages
        uses: actions/upload-artifact@v6
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.tar.xz

  macos-dmg:
    name: macOS ZIP + DMG
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          install-deps: false
          cache: true

      - name: Configure and build
        run: |
          set -euo pipefail
          cmake --preset release
          cmake --build --preset release --parallel

      - name: Build the ZIP (Ducktor.app + ad hoc signature)
        run: |
          set -euo pipefail
          cpack --preset release
          ls -lh dist/*.zip

      - name: Build the DMG
        run: |
          set -euo pipefail
          bash packaging/macos/build-dmg.sh
          ls -lh dist/*.dmg

      - name: Smoke test the DMG
        run: |
          set -euo pipefail
          DMG="$(ls dist/*.dmg)"
          MOUNT="$(hdiutil attach "$DMG" -nobrowse -readonly -noverify -noautoopen \
              | awk -F'\t' '/\/Volumes\// {print $NF; exit}')"
          test -n "$MOUNT"
          ls -l "$MOUNT"
          test -d "$MOUNT/Ducktor.app"
          test -L "$MOUNT/Applications"
          codesign --verify "$MOUNT/Ducktor.app"
          hdiutil detach "$MOUNT"

      - name: Upload the packages
        uses: actions/upload-artifact@v6
        with:
          name: macos-packages
          path: |
            dist/*.zip
            dist/*.dmg

  arch-pkgbuild:
    name: Arch PKGBUILD
    runs-on: ubuntu-24.04
    container:
      image: archlinux/archlinux:latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Install the build tools
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm base-devel

      # Validates the PKGBUILD syntax and metadata without downloading or
      # building the sources (fast). The full build is opt-in below.
      - name: Validate the PKGBUILD
        run: |
          set -euo pipefail
          cd packaging/arch
          makepkg --printsrcinfo

      - name: Full source build (optional)
        if: ${{ inputs.arch_full_build }}
        run: |
          set -euo pipefail
          cd packaging/arch
          makepkg --syncdeps --noconfirm

      - name: Upload the package
        if: ${{ inputs.arch_full_build }}
        uses: actions/upload-artifact@v6
        with:
          name: arch-package
          path: packaging/arch/ducktor-*.pkg.tar.zst
