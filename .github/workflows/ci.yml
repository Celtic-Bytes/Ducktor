# Builds the interface with the ui-only preset (no inference engines, so it
# is fast) and runs the test suite. Runs on every push and pull request to
# main; a green check here means the C++/QML code still compiles and
# tst_core passes. Full engine builds happen in the Release workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  tests:
    name: Interface build and tests (Linux)
    # Pinned (not ubuntu-latest): the label migrates to Ubuntu 26.04 in
    # November 2026, and this job builds directly on the host, so a floating
    # label would change the build environment without a review.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install the system libraries Qt needs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libpulse-dev

      # jurplel/install-qt-action (aqt) installs the community edition of Qt
      # from the qt.io online installer; it needs no account or token. The
      # base Qt 6 package already contains Qml, Quick, QuickControls2, Svg
      # and Tools; only Multimedia is a separate addon module. The Qt 6.8+
      # metadata names the Linux spec with the full architecture
      # (linux_gcc_64); the short gcc_64 no longer resolves.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.3
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          install-deps: false
          cache: true

      - name: Configure and build (ui-only)
        run: |
          set -euo pipefail
          cmake --preset ui-only
          cmake --build --preset ui-only --parallel

      - name: Run the tests
        run: ctest --preset ui-only
