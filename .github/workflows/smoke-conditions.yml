# DIAGNOSTIC (temporary, to be deleted): A/B test of the needs/if pattern
# used by releases.yml. "check" is skipped on a manual run (its if only
# matches push events). The two build jobs then show which pattern lets a
# job continue after a skipped dependency:
#   - build-old-pattern: needs.*.result comparison only -> expected skipped
#   - build-new-pattern: always() && needs.*.result -> expected to run
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "check ran"

  build-old-pattern:
    needs: [check]
    if: ${{ needs.check.result == 'success' || needs.check.result == 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "old pattern ran (unexpected on manual runs)"

  build-new-pattern:
    needs: [check]
    if: ${{ always() && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "new pattern ran"
