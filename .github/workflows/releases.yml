# Builds all platform packages (.deb, .tar.xz, AppImage, Flatpak, Windows
# ZIP, macOS ZIP and DMG), validates the Arch PKGBUILD (full source build
# only on request), and publishes the packages to a GitHub release. Triggers
# only on version tags (v1.0.0); a manual run (workflow_dispatch) builds
# everything but never touches the release, so it is a way to test the
# pipeline without a tag.
#
# The Linux job builds inside an Ubuntu 26.04 container with the
# distribution's Qt 6.10 packages, so the .deb dependencies are derived from
# standard qt6-* packages (cmake/DebianQtDepends.cmake). The Windows and
# macOS jobs install Qt with jurplel/install-qt-action (aqt) from the qt.io
# online installer; the community edition needs no account or token.
#
# Host runners are pinned to ubuntu-24.04 instead of ubuntu-latest: the
# label migrates to Ubuntu 26.04 in November 2026, and a floating label
# would change the build host without a review. The Linux, Flatpak and Arch
# jobs run inside their own containers, so their artifacts are unaffected
# by the host version.
name: Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      arch_full_build:
        description: Run the full Arch source build (slow)
        type: boolean
        default: false

# One run per ref at a time; a re-run is queued instead of being cancelled,
# so a tag push never races with itself. The group name is explicit (not
# built from github.workflow) so it stays stable if the workflow is renamed.
concurrency:
  group: ducktor-releases-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: 6.9.3

jobs:
  check-version:
    name: Check tag matches the project version
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Check tag matches the project version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^project(Ducktor VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $VERSION in CMakeLists.txt" >&2
            echo "Bump project(Ducktor VERSION ...) to ${GITHUB_REF_NAME#v}, commit, delete the tag, and push it again." >&2
            exit 1
          fi
          echo "Tag matches project version $VERSION"

  linux:
    name: Linux packages (.deb + .tar.xz + AppImage)
    needs: [check-version]
    if: ${{ always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      # Ubuntu 26.04's Qt 6.10 packages satisfy the Qt >= 6.9 requirement,
      # and building against the distribution's packages is what lets
      # cmake/DebianQtDepends.cmake derive the .deb dependencies from standard
      # qt6-* packages.
      - name: Install the toolchain
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build file git curl ca-certificates \
            dpkg-dev \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libpulse-dev \
            qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-multimedia-dev qt6-svg-dev qt6-svg-plugins qt6-tools-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-templates qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript \
          && rm -rf /var/lib/apt/lists/*

      - name: Configure and build
        run: |
          set -euo pipefail
          cmake --preset release
          cmake --build --preset release --parallel

      - name: Build the .deb and the .tar.xz
        run: |
          set -euo pipefail
          cpack --preset release
          ls -lh dist/*.deb dist/*.tar.xz

      - name: Build the AppImage
        run: |
          set -euo pipefail
          bash packaging/linux/build-appimage.sh
          ls -lh dist/*.AppImage

      - name: Upload the packages
        uses: actions/upload-artifact@v6
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.tar.xz
            dist/*.AppImage

  windows:
    name: Windows ZIP
    needs: [check-version]
    if: ${{ always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: win64_msvc2022_64
          # The base Qt 6 package already contains Qml, Quick, QuickControls2,
          # Svg and Tools; only Multimedia is a separate addon module.
          modules: qtmultimedia
          install-deps: false
          cache: true

      # The runner ships Visual Studio with the C++ workload, but its
      # environment is not active in the default shell. Without cl.exe on the
      # PATH CMake picks up the runner's MinGW, which cannot link the MSVC Qt
      # this job installs (and piper only compiles its Windows console code
      # with MSVC). Locate the newest VS installation with vswhere (the
      # edition and year vary between runner images) and activate its x64
      # environment before configuring.
      - name: Configure and build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          if not defined VS_PATH (
            echo No Visual Studio installation with the C++ workload found
            exit /b 1
          )
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset release
          cmake --build --preset release --parallel

      - name: Build the ZIP
        run: |
          cpack --preset release
          Get-ChildItem dist\*.zip

      - name: Upload the package
        uses: actions/upload-artifact@v6
        with:
          name: windows-package
          path: dist/*.zip

  macos:
    name: macOS ZIP + DMG
    needs: [check-version]
    if: ${{ always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      # The Qt 6.9 macOS package (the only one, clang_64) is a universal2
      # binary, so it runs natively on the Apple Silicon macos-latest runner
      # and the ZIP contains a native arm64 Ducktor.app.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: clang_64
          # The base Qt 6 package already contains Qml, Quick, QuickControls2,
          # Svg and Tools; only Multimedia is a separate addon module.
          modules: qtmultimedia
          install-deps: false
          cache: true

      - name: Configure and build
        run: |
          cmake --preset release
          cmake --build --preset release --parallel

      - name: Build the ZIP (Ducktor.app + ad hoc signature)
        run: |
          cpack --preset release
          ls -lh dist/*.zip

      - name: Build the DMG (Ducktor.app + /Applications link)
        run: |
          set -euo pipefail
          bash packaging/macos/build-dmg.sh
          ls -lh dist/*.dmg

      - name: Smoke test the DMG
        run: |
          set -euo pipefail
          DMG="$(ls dist/*.dmg)"
          MOUNT="$(hdiutil attach "$DMG" -nobrowse -readonly -noverify -noautoopen \
              | awk -F'\t' '/\/Volumes\// {print $NF; exit}')"
          test -n "$MOUNT"
          ls -l "$MOUNT"
          test -d "$MOUNT/Ducktor.app"
          test -L "$MOUNT/Applications"
          test -x "$MOUNT/Ducktor.app/Contents/MacOS/Ducktor"
          # The DMG is built from the ZIP; make sure both carry the same app.
          ZIP="$(ls dist/*.zip)"
          UNZIP="$(mktemp -d)"
          ditto -x -k "$ZIP" "$UNZIP"
          APP_ZIP="$(find "$UNZIP" -maxdepth 3 -type d -name 'Ducktor.app' | head -n1)"
          diff -r "$APP_ZIP" "$MOUNT/Ducktor.app"
          rm -rf "$UNZIP"
          # Check the ad hoc signature without a full verification walk:
          # `codesign --verify` (even pointed at the main executable) walks the
          # whole bundle and treats every file in Contents/MacOS as a code
          # object, so it flags the plain-data espeak-ng dictionaries shipped
          # there next to the engines as unsigned. The ZIP ships the identical
          # bundle and runs fine, so checking the bundle seal and the
          # executable's signature is enough.
          test -f "$MOUNT/Ducktor.app/Contents/_CodeSignature/CodeResources"
          codesign -dv "$MOUNT/Ducktor.app/Contents/MacOS/Ducktor"
          hdiutil detach "$MOUNT"

      - name: Upload the packages
        uses: actions/upload-artifact@v6
        with:
          name: macos-package
          path: |
            dist/*.zip
            dist/*.dmg

  flatpak:
    name: Flatpak
    needs: [check-version]
    if: ${{ always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    runs-on: ubuntu-24.04
    container:
      # The official Flathub image: it already has the flatpak tooling and
      # the runtime repos cached; --privileged is required by flatpak-builder.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Read the project version
        id: version
        run: |
          set -euo pipefail
          echo "version=$(sed -n 's/^project(Ducktor VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Build the Flatpak and the bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.celticbytes.Ducktor.yml
          bundle: Ducktor-${{ steps.version.outputs.version }}.flatpak
          # The bundle is built in the workspace root; the release job
          # collects it through the artifact below.
          upload-artifact: false

      - name: Upload the package
        uses: actions/upload-artifact@v6
        with:
          name: flatpak-package
          path: Ducktor-*.flatpak

  arch-pkgbuild:
    name: Arch PKGBUILD
    needs: [check-version]
    if: ${{ always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    runs-on: ubuntu-24.04
    container:
      image: archlinux/archlinux:latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Install the build tools
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm base-devel

      # makepkg refuses to run as root (the container's default user), so a
      # regular user is created and handed the repository.
      - name: Create the build user
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # Install the makedepends declared in the PKGBUILD: makepkg cannot read
      # them as root (it refuses to run at all), and the build user has no
      # sudo, so the list is read by the build user and installed by root.
      # The srcinfo lists each array item on its own indented line, like
      # "\tmakedepends = cmake".
      - name: Install the makedepends from the PKGBUILD
        run: |
          set -euo pipefail
          MAKEDEPS="$(su -s /bin/bash builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg --printsrcinfo" \
              | sed -n 's/^[[:space:]]*makedepends[[:space:]]*=[[:space:]]*//p' | tr -d "'")"
          if [ -z "$MAKEDEPS" ]; then
              echo "No makedepends found in the PKGBUILD srcinfo" >&2
              exit 1
          fi
          pacman -S --noconfirm $MAKEDEPS

      # Validates the PKGBUILD syntax and metadata without downloading or
      # building the sources (fast). The full build is opt-in through the
      # workflow_dispatch input, because it compiles the three engines.
      - name: Validate the PKGBUILD
        run: |
          set -euo pipefail
          su -s /bin/bash builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg --printsrcinfo"

      - name: Full source build (optional)
        if: ${{ inputs.arch_full_build }}
        run: |
          set -euo pipefail
          su -s /bin/bash builder -c "cd $GITHUB_WORKSPACE/packaging/arch && makepkg --syncdeps --noconfirm"

      - name: Upload the package
        if: ${{ inputs.arch_full_build }}
        uses: actions/upload-artifact@v6
        with:
          name: arch-package
          path: packaging/arch/ducktor-*.pkg.tar.zst

  release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: [linux, windows, macos, flatpak, arch-pkgbuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Creating a release needs write access; the default token only gets it
    # when the repository's Actions permission setting
    # (Settings → Actions → General) allows read and write. This scopes the
    # requirement to this job instead of every job in the workflow.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create or update the release and upload the packages
        uses: softprops/action-gh-release@v3
        with:
          name: Ducktor ${{ github.ref_name }}
          body: |
            Automated release. Packages: .deb, .tar.xz, AppImage and Flatpak
            for Linux, a portable ZIP for Windows, and a ZIP and a DMG for
            macOS. For Arch Linux, the PKGBUILD in packaging/arch is
            validated by the workflow; the AUR package builds from it.
          files: artifacts/**/*
